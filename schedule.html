<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    /* schedule.html ya no es una pagina aparte -- Scheduling ahora
       vive dentro de admin.html como un panel mas, igual que
       Approvals/Active/etc. Este archivo se queda nomas por si
       alguien tiene el link viejo guardado. */
    const params = new URLSearchParams(location.search);
    const orderId = params.get('orderId');
    let target = 'admin.html?tab=schedule';
    if (orderId) target += '&orderId=' + encodeURIComponent(orderId);
    location.replace(target);
  </script>
</head>
<body></body>
</html>
