<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS Solutions — Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #111111; --gold: #C9A84C; --white: #FFFFFF;
      --bg: #F8F7F4; --gray: #6B6B6B; --border: #E0DDD6;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--black); min-height: 100vh; }

    nav {
      background: var(--black);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 60px; position: sticky; top: 0; z-index: 100;
    }
    .nav-logo img { height: 36px; object-fit: contain; }
    .nav-logo-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--white); }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-user { font-size: 13px; color: #aaa; }
    .nav-back, .btn-signout {
      font-size: 12px; color: var(--gold); background: none; border: none;
      cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: .04em;
      text-decoration: none;
    }

    .stub-wrap { max-width: 640px; margin: 90px auto; padding: 0 24px; text-align: center; }
    .stub-icon { font-size: 40px; margin-bottom: 20px; }
    .stub-wrap h1 { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; margin-bottom: 10px; }
    .stub-wrap p { font-size: 14px; color: var(--gray); line-height: 1.7; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <img id="nav-logo" src="/api/site-image?name=Logo.png" alt="GS Solutions"
         onerror="this.style.display='none';document.getElementById('nav-logo-text').style.display='block'">
    <span id="nav-logo-text" class="nav-logo-text" style="display:none">GS Solutions</span>
  </div>
  <div class="nav-right">
    <a class="nav-back" href="admin.html">&larr; Back to Admin</a>
    <span class="nav-user" id="nav-user"></span>
    <button class="btn-signout" onclick="signOut()">Sign out</button>
  </div>
</nav>

<div class="stub-wrap">
  <div class="stub-icon">&#128197;</div>
  <h1>Schedule</h1>
  <p>Coming soon.</p>
</div>

<script>
  const stored = sessionStorage.getItem('admin_account');
  if (!stored) {
    window.location.href = 'index.html';
  } else {
    const adminUser = JSON.parse(stored);
    document.getElementById('nav-user').textContent = adminUser.name || adminUser.email;
  }

  function signOut() {
    sessionStorage.removeItem('admin_account');
    sessionStorage.removeItem('admin_token');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
