<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS Solutions — Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #111111;
      --gold: #C9A84C;
      --white: #FFFFFF;
      --bg: #F8F7F4;
      --gray: #6B6B6B;
      --border: #E0DDD6;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: var(--white);
      border-radius: 4px;
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo-wrap { margin-bottom: 32px; }
    .logo-wrap img { height: 64px; object-fit: contain; }
    .logo-placeholder {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--black);
      letter-spacing: .05em;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 36px;
    }
    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-login:hover { background: #2a2a2a; }
    .btn-login svg { flex-shrink: 0; }
    .error-msg {
      margin-top: 16px;
      font-size: 13px;
      color: #c0392b;
      display: none;
    }
    .loading-msg {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      display: none;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo-wrap">
      <img id="logo" src="/api/site-image?name=Logo.png" alt="GS Solutions"
           onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'">
      <div id="logo-text" class="logo-placeholder" style="display:none">GS Solutions</div>
    </div>
    <h1>Admin Portal</h1>
    <p class="subtitle">Sign in with your GS Solutions Microsoft account</p>
    <button class="btn-login" id="btn-login" onclick="signIn()">
      <svg width="20" height="20" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="10" height="10" fill="#F35325"/>
        <rect x="12" y="1" width="10" height="10" fill="#81BC06"/>
        <rect x="1" y="12" width="10" height="10" fill="#05A6F0"/>
        <rect x="12" y="12" width="10" height="10" fill="#FFBA08"/>
      </svg>
      Sign in with Microsoft
    </button>
    <div class="error-msg" id="error-msg"></div>
    <div class="loading-msg" id="loading-msg">Signing in…</div>
    <p class="footer-note">Access restricted to GS Solutions staff</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
  <script>
    const msalConfig = {
      auth: {
        clientId: '18dfcf2e-0059-40f5-831c-69d13b9091fc',
        authority: 'https://login.microsoftonline.com/d18a66ea-5185-4a02-99cc-46b6578ff498',
        redirectUri: 'https://admin.gsocd.com/'
      },
      cache: { cacheLocation: 'sessionStorage' }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    msalInstance.initialize().then(() => {
      msalInstance.handleRedirectPromise().then(response => {
        if (response) {
          sessionStorage.setItem('admin_account', JSON.stringify({
            name: response.account.name,
            email: response.account.username
          }));
          window.location.href = 'admin.html';
          return;
        }
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
          window.location.href = 'admin.html';
        }
      }).catch(e => console.error(e));
    });

    function signIn() {
      document.getElementById('btn-login').disabled = true;
      document.getElementById('loading-msg').style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
      msalInstance.loginRedirect({
        scopes: ['User.Read'],
        prompt: 'select_account'
      }).catch(e => {
        document.getElementById('error-msg').textContent = 'Sign in failed: ' + e.message;
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('btn-login').disabled = false;
      });
    }
  </script>
</body>
</html>
